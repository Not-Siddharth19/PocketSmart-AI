{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <div class="logo-center">PocketSmart</div>
    <div class="tagline">AI-Powered Budget Planning</div>
    <h1>Welcome Back</h1>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="loginUsername">Username</label>
      <div class="input-with-icon">
        <i class="fa-solid fa-user input-icon"></i>
        <input type="text" id="loginUsername" name="username" class="form-control" placeholder="Enter your username" required>
      </div>
    </div>

    <div class="form-group">
      <label for="loginPassword">Password</label>
      <div class="input-with-icon">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
    </div>

    <div style="text-align: right; margin-bottom: 20px;">
      <a href="#" style="font-size: 13px; color: var(--text-muted); text-decoration: none;">Forgot Password?</a>
    </div>

    <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">
      Sign In <i class="fa-solid fa-arrow-right"></i>
    </button>
  </form>

  <div id="loginError" class="error-banner"></div>

  <div class="auth-footer-text">
    Don't have an account? <a href="/register">Create Account</a>
  </div>
</div>
{% endblock %}
