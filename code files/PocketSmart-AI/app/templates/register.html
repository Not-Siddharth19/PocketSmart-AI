{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <div class="logo-center">PocketSmart</div>
    <div class="tagline">AI-Powered Budget Planning</div>
    <h1>Create Your Account</h1>
  </div>

  <form id="registerForm">
    <div class="form-group">
      <label for="regUsername">Username</label>
      <div class="input-with-icon">
        <i class="fa-solid fa-user input-icon"></i>
        <input type="text" id="regUsername" name="username" class="form-control" placeholder="Choose a username" required minlength="3">
      </div>
    </div>

    <div class="form-group">
      <label for="regEmail">Email</label>
      <div class="input-with-icon">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input type="email" id="regEmail" name="email" class="form-control" placeholder="Enter your email" required>
      </div>
    </div>

    <div class="form-group">
      <label for="regPassword">Password</label>
      <div class="input-with-icon">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="regPassword" name="password" class="form-control" placeholder="Create a strong password" required minlength="6">
      </div>
    </div>

    <div class="form-group">
      <label for="regConfirmPassword">Confirm Password</label>
      <div class="input-with-icon">
        <i class="fa-solid fa-circle-check input-icon"></i>
        <input type="password" id="regConfirmPassword" name="confirm_password" class="form-control" placeholder="Confirm your password" required minlength="6">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full" id="regSubmitBtn">
      <i class="fa-solid fa-user-plus"></i> Create Account
    </button>
  </form>

  <div id="registerError" class="error-banner"></div>

  <div class="auth-footer-text">
    Already have an account? <a href="/login">Sign In</a>
  </div>
</div>
{% endblock %}
